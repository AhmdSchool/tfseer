<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>القرآن الكريم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap">
<style>
:root{
  --green:#106b2e; --gold:#c8a038; --bg:#f7f5ee; --card:#fff; --text:#1c1c1c; --muted:#6c6c6c; --border:#e3ded0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:"Cairo",sans-serif; background:var(--bg); color:var(--text);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
header{
  background:var(--green); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:10; box-shadow:0 2px 6px rgba(0,0,0,.1);
  padding-top:calc(14px + env(safe-area-inset-top,0px));
}
header h1{font-size:18px; margin:0; font-weight:700}
header button{
  background:var(--gold); border:none; color:#fff; padding:8px 12px; border-radius:6px; cursor:pointer; font-family:inherit; font-weight:600;
}
.layout{display:flex; height:calc(100vh - 58px); overflow:hidden}
aside{
  width:300px; min-width:220px; background:var(--card); border-left:1px solid var(--border); overflow-y:auto; flex-shrink:0;
  transition:margin-right .25s ease;
}
aside.hidden{margin-right:-300px}
.search-box{padding:12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--card)}
.search-box input{
  width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size:14px; background:#faf9f5;
}
ul.sura-list{list-style:none; margin:0; padding:0}
ul.sura-list li a{
  display:flex; align-items:center; justify-content:space-between; padding:11px 14px; color:var(--text); text-decoration:none;
  border-bottom:1px solid #f0ede2; font-size:14.5px;
}
ul.sura-list li a:hover, ul.sura-list li a.active{background:rgba(16,107,46,.08); color:var(--green)}
.snum{
  display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%;
  background:#efeade; color:var(--gold); font-size:12px; font-weight:700; margin-left:8px;
}
li a.active .snum{background:var(--green); color:#fff}
.sname-en{color:var(--muted); font-size:11.5px}
main{flex:1; overflow-y:auto; padding:0}
.quran-header{
  background:linear-gradient(180deg,#fff,#faf7ee); border-bottom:1px solid var(--border); text-align:center; padding:28px 16px;
}
.quran-header h2{margin:0 0 4px; font-size:26px; color:var(--green); font-family:"Amiri",serif}
.quran-header p{margin:0; color:var(--muted); font-size:13px}
.basmala{font-family:"Amiri",serif; font-size:22px; color:var(--gold); margin-top:12px}
.ayat{
  max-width:820px; margin:0 auto; padding:30px 24px 80px; font-family:"Amiri",serif; font-size:26px; line-height:2.6;
  text-align:justify; text-align-last:center;
}
.ayat .verse{cursor:pointer}
.ayat .verse:hover{color:var(--green)}
.ayah-num{
  display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; font-size:13px; font-family:"Cairo",sans-serif;
  color:var(--gold); border:1.5px solid var(--gold); border-radius:50%; margin:0 6px; vertical-align:middle;
}
.state-msg{text-align:center; padding:60px 20px; color:var(--muted); font-size:15px}
.spinner{
  width:34px; height:34px; border:3px solid #e3ded0; border-top-color:var(--green); border-radius:50%;
  margin:0 auto 14px; animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width: 720px){
  aside{position:fixed; top:58px; bottom:0; right:0; z-index:20; width:82vw; box-shadow:2px 0 10px rgba(0,0,0,.15)}
  aside.hidden{margin-right:-82vw}
  .layout{height:calc(100vh - 58px)}
  .ayat{font-size:22px; padding:20px 16px 60px}
}
</style>
</head>
<body>
<header>
  <button id="toggleSidebar">☰ السور</button>
  <h1>القرآن الكريم</h1>
  <span style="width:70px"></span>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="search-box">
      <input id="search" placeholder="ابحث عن اسم سورة…" autocomplete="off">
    </div>
    <ul class="sura-list" id="suraList"></ul>
  </aside>

  <main>
    <div class="quran-header">
      <h2 id="suraTitleAr">اختر سورة من القائمة</h2>
      <p id="suraTitleEn"></p>
      <div class="basmala" id="basmala" style="display:none">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    </div>
    <div id="content">
      <div class="state-msg">اختر سورة من القائمة الجانبية لعرض آياتها</div>
    </div>
  </main>
</div>

<script>
const suras = [
["الفاتحة","Al-Fatiha",7],["البقرة","Al-Baqara",286],["آل عمران","Aal-Imran",200],["النساء","An-Nisaa",176],
["المائدة","Al-Ma'ida",120],["الأنعام","Al-An'am",165],["الأعراف","Al-A'raf",206],["الأنفال","Al-Anfal",75],
["التوبة","At-Tawba",129],["يونس","Yunus",109],["هود","Hud",123],["يوسف","Yusuf",111],["الرعد","Ar-Ra'd",43],
["إبراهيم","Ibrahim",52],["الحجر","Al-Hijr",99],["النحل","An-Nahl",128],["الإسراء","Al-Isra",111],
["الكهف","Al-Kahf",110],["مريم","Maryam",98],["طه","Ta-Ha",135],["الأنبياء","Al-Anbiya",112],
["الحج","Al-Hajj",78],["المؤمنون","Al-Mu'minun",118],["النور","An-Nur",64],["الفرقان","Al-Furqan",77],
["الشعراء","Ash-Shu'ara",227],["النمل","An-Naml",93],["القصص","Al-Qasas",88],["العنكبوت","Al-Ankabut",69],
["الروم","Ar-Rum",60],["لقمان","Luqman",34],["السجدة","As-Sajda",30],["الأحزاب","Al-Ahzab",73],["سبأ","Saba",54],
["فاطر","Fatir",45],["يس","Ya-Sin",83],["الصافات","As-Saffat",182],["ص","Sad",88],["الزمر","Az-Zumar",75],
["غافر","Ghafir",85],["فصلت","Fussilat",54],["الشورى","Ash-Shura",53],["الزخرف","Az-Zukhruf",89],
["الدخان","Ad-Dukhan",59],["الجاثية","Al-Jathiya",37],["الأحقاف","Al-Ahqaf",35],["محمد","Muhammad",38],
["الفتح","Al-Fath",29],["الحجرات","Al-Hujurat",18],["ق","Qaf",45],["الذاريات","Adh-Dhariyat",60],
["الطور","At-Tur",49],["النجم","An-Najm",62],["القمر","Al-Qamar",55],["الرحمن","Ar-Rahman",78],
["الواقعة","Al-Waqi'a",96],["الحديد","Al-Hadid",29],["المجادلة","Al-Mujadila",22],["الحشر","Al-Hashr",24],
["الممتحنة","Al-Mumtahina",13],["الصف","As-Saf",14],["الجمعة","Al-Jumu'a",11],["المنافقون","Al-Munafiqun",11],
["التغابن","At-Taghabun",18],["الطلاق","At-Talaq",12],["التحريم","At-Tahrim",12],["الملك","Al-Mulk",30],
["القلم","Al-Qalam",52],["الحاقة","Al-Haqqa",52],["المعارج","Al-Ma'arij",44],["نوح","Nuh",28],["الجن","Al-Jinn",28],
["المزمل","Al-Muzzammil",20],["المدثر","Al-Muddaththir",56],["القيامة","Al-Qiyama",40],["الإنسان","Al-Insan",31],
["المرسلات","Al-Mursalat",50],["النبأ","An-Naba",40],["النازعات","An-Nazi'at",46],["عبس","Abasa",42],
["التكوير","At-Takwir",29],["الإنفطار","Al-Infitar",19],["المطففين","Al-Mutaffifin",36],["الإنشقاق","Al-Inshiqaq",25],
["البروج","Al-Buruj",22],["الطارق","At-Tariq",17],["الأعلى","Al-A'la",19],["الغاشية","Al-Ghashiya",26],
["الفجر","Al-Fajr",30],["البلد","Al-Balad",20],["الشمس","Ash-Shams",15],["الليل","Al-Lail",21],["الضحى","Ad-Duha",11],
["الشرح","Ash-Sharh",8],["التين","At-Tin",8],["العلق","Al-Alaq",19],["القدر","Al-Qadr",5],["البينة","Al-Bayyina",8],
["الزلزلة","Az-Zalzala",8],["العاديات","Al-Adiyat",11],["القارعة","Al-Qari'a",11],["التكاثر","At-Takathur",8],
["العصر","Al-Asr",3],["الهمزة","Al-Humaza",9],["الفيل","Al-Fil",5],["قريش","Quraish",4],["الماعون","Al-Ma'un",7],
["الكوثر","Al-Kauthar",3],["الكافرون","Al-Kafirun",6],["النصر","An-Nasr",3],["المسد","Al-Masad",5],
["الإخلاص","Al-Ikhlas",4],["الفلق","Al-Falaq",5],["الناس","An-Nas",6]
];

const listEl = document.getElementById('suraList');
const contentEl = document.getElementById('content');
const titleAr = document.getElementById('suraTitleAr');
const titleEn = document.getElementById('suraTitleEn');
const basmalaEl = document.getElementById('basmala');
const searchEl = document.getElementById('search');
const sidebar = document.getElementById('sidebar');

function renderList(filter=''){
  listEl.innerHTML='';
  suras.forEach((s,i)=>{
    const num=i+1;
    if(filter && !s[0].includes(filter) && !s[1].toLowerCase().includes(filter.toLowerCase())) return;
    const li=document.createElement('li');
    li.innerHTML=`<a href="#" data-n="${num}"><span><span class="snum">${num}</span>${s[0]}</span><span class="sname-en">${s[1]}</span></a>`;
    listEl.appendChild(li);
  });
}
renderList();

searchEl.addEventListener('input', e=>renderList(e.target.value.trim()));

document.getElementById('toggleSidebar').addEventListener('click', ()=>{
  sidebar.classList.toggle('hidden');
});

let fullQuranLoaded = false;

function suraBlockHTML(surahData, num){
  const s = suras[num-1];
  const showBasmala = !(num===1 || num===9);
  let html = `<div class="sura-block" id="sura-${num}">
    <div class="quran-header" style="margin-top:0">
      <h2>${s[0]}</h2>
      <p>${s[1]} — ${s[2]} آية</p>
      ${showBasmala ? '<div class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>' : ''}
    </div>
    <div class="ayat"><div>`;
  surahData.ayahs.forEach(a=>{
    html += `<span class="verse" title="آية ${a.numberInSurah}">${a.text}</span><span class="ayah-num">${a.numberInSurah}</span> `;
  });
  html += '</div></div></div>';
  return html;
}

async function loadFullQuran(){
  titleAr.textContent = 'القرآن الكريم كاملاً';
  titleEn.textContent = '114 سورة — 6236 آية';
  basmalaEl.style.display = 'none';
  contentEl.innerHTML = `<div class="state-msg"><div class="spinner"></div>جارِ تحميل القرآن الكريم كاملاً… قد يستغرق ذلك لحظات</div>`;
  try{
    const res = await fetch('https://api.alquran.cloud/v1/quran/quran-uthmani');
    const data = await res.json();
    const surahs = data.data.surahs;
    let html = '';
    surahs.forEach(s=>{ html += suraBlockHTML(s, s.number); });
    contentEl.innerHTML = html;
    fullQuranLoaded = true;
  }catch(err){
    contentEl.innerHTML = `<div class="state-msg">تعذّر تحميل القرآن، حاول مرة أخرى.<br><button id="retryFull" style="margin-top:12px;padding:8px 16px;border:none;border-radius:6px;background:var(--green);color:#fff;cursor:pointer;font-family:inherit">إعادة المحاولة</button></div>`;
    document.getElementById('retryFull')?.addEventListener('click', loadFullQuran);
  }
}

function goToSura(n){
  document.querySelectorAll('#suraList a').forEach(x=>x.classList.remove('active'));
  document.querySelector(`#suraList a[data-n="${n}"]`)?.classList.add('active');
  if(fullQuranLoaded){
    document.getElementById('sura-'+n)?.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

listEl.removeEventListener?.('click', ()=>{});
listEl.addEventListener('click', e=>{
  const a = e.target.closest('a[data-n]');
  if(!a) return;
  e.preventDefault();
  goToSura(parseInt(a.dataset.n,10));
  if(window.innerWidth <= 720) sidebar.classList.add('hidden');
});

loadFullQuran();
</script>
</body>
</html>
